# Local infrastructure for GP Media Server.
#
#   docker compose up -d                  # Postgres + Redis only (for `npm run dev`)
#   docker compose --profile api up -d    # also build and run the API container
#
# Host ports default to 5433 (Postgres) and 6379 (Redis) so they don't clash with
# local installs; override with POSTGRES_PORT / REDIS_PORT in .env.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog_db
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - blog_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d blog_db']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - blog_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ['api']
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blog_db?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: 'true'
    ports:
      - '${PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  blog_pg_data:
  blog_redis_data:
